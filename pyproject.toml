# this_file: pyproject.toml
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"
[project]
name = "fontlab-python-instamix"
dynamic = ["version"]
description = "Stdlib-only installer for FontLab 9 extensions, scripts and Python packages"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
[project.urls]
Repository = "https://github.com/fontlabcom/fontlab-python-instamix"
[project.scripts]
fontlab-instamix = "fontlab_instamix.cli:main"
[project.optional-dependencies]
remote = ["fontlab-remopy>=2.0.13"]
test = ["pytest>=8"]
[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.1.0"
[tool.hatch.build.hooks.vcs]
version-file = "src/fontlab_instamix/__version__.py"
[tool.hatch.build.targets.wheel]
packages = ["src/fontlab_instamix"]
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "install.vfpy", "stub", "pyproject.toml", "README.md", "PLAN.md", "LICENSE", "CHANGELOG.md", "test.sh", "build.sh", "publish.sh"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.fontlab-install]
# install.vfpy: reverse-domain id; instamix installs itself into site-packages.
id = "com.fontlab.instamix"
name = "fontlab-python-instamix"
packages = ["src/fontlab_instamix"]
